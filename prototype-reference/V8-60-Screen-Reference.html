 'keyboard':()=>modal('Keyboard & viewport controls',table([['Ctrl / Cmd + K','Screen / action search','Active'],['Alt + ← / →','Previous / next screen','Active'],['Q / W / E / R','Select / move / rotate / scale','Active demo'],['Escape','Close dialog / cancel gizmo drag','Active'],['Drag white center','Transform selected demo handle','Schematic only'],['Ctrl + Z / Ctrl + Y','Undo / redo in real UE phases','Not simulated'],['F11','Browser fullscreen','Browser command']],['Shortcut','Action','Scope'])),
 'simulate-compile':simulateCompile,'cancel-compile':cancelCompile,'compile-fail':()=>{cancelCompile();if($('#compile-notice'))$('#compile-notice').textContent='Example failure: lane connector references an unknown lane ID. Publish blocked; previous valid output retained.';log('Displayed an explicit compile failure example.','Fixture')},
 'import-mesh':importMesh,'asset-detail':()=>assetDetail(),
 'export-scenario':()=>{const s=SC[st.id-1];download(`screen-${num(s.id)}-review-scenario.json`,{notice:'Prototype design scenario; no engine execution.',screen:s,localFields:s.fields.map(f=>({label:f.label,value:pageVal(s,f)})),acceptanceStatus:'Not executed in UE'})},
 'conflict-save':()=>{const values=$$('select[id^="conflict-"]').map(e=>e.value);log('Recovery review choices recorded in local demo log: '+values.join('; '),'Demo');closeModal();toast('Recovery choices recorded as a demo. No source or draft was overwritten.')},
 'snap':()=>modal('Transform snapping · design settings',`<p>Future engine tools will snap complete transactions. The schematic uses unsnapped screen-space drag for review.</p>${table([['Translation','0.25 m','Proposed grid snap'],['Rotation','15°','Proposed angular snap'],['Coordinate space','Local / World','Explicit transform choice']],['Setting','Default','Contract'])}`),
 'space':()=>modal('Local and world transform spaces',`<p>The real tool must display and convert offsets in the selected coordinate space, preserving the shared junction transform and each sub-point identity.</p><div class="notice">This browser gizmo operates in schematic screen space; it does not perform Unreal world/local coordinate conversion.</div>`),
 'data-layers':()=>{st.drawer='runtime';renderDrawer();toast('Opened data layers and the runtime contract summary.')},
 'create':()=>modal('Create authored records',`<p>World, State, City, Highway, and activation records are authoring entities. Highway points are discovered from Landscape and are not a second hand-authored geometry store.</p>${table([['World / State / City','Create semantic ownership','Identity + hierarchy'],['Highway','Bind native spline chain','Geometry remains Landscape-owned'],['Bus / parking / seat','Create activation payload','Gizmos edit authored offsets'],['Highway point','Scan / bind from Landscape','No duplicate manual point model']],['Record','Creation flow','Safety'])}`),
 'pin':()=>toast('The final Details tab is independently dockable. This HTML review uses a fixed three-panel layout.'),
 'workspace-menu':()=>modal('Workspace presets',`<p>Future native tabs remain usable outside Landscape Mode.</p>${table([['Authoring','Hierarchy + Details + viewport','Primary workflow'],['Review','Read-only data + Activity','Evidence / diff workflow'],['Compact','Reduced dock width','All commands via palette'],['Custom','Saved user-local layout','No project-data duplication']],['Workspace','Panels','Purpose'])}`,`${btn('Close','close-modal')}${btn('Appearance & shortcuts','settings','settings','primary')}`),
 'drawer-settings':()=>toast('Content thumbnails are SVG fixtures. Click one to inspect its semantic slot and resolution source.'),
 'reset-view':()=>{st.top=false;st.zoom=1;st.guide=true;st.tool='move';st.filter='';render();toast('Reset the view only. Your review notes and catalog assignments are preserved.')},
 'menu-file':()=>modal('File · review artifacts',`<p>Export your review decisions or inspect synthetic contract examples. There is no project save or engine mutation in this prototype.</p>`,`${btn('Runtime fixture','runtime-export','download')}${btn('Review notes','review-export','save','primary')}`),
 'menu-edit':()=>modal('Edit · draft first',`<p>Edit fields in Details, validate, and apply to the local demo. Revert affects only the draft.</p><div class="notice">Undo and redo are intentionally omitted here. Real implementation requires Unreal-authoritative transactions, Modify() before mutation, and named atomic actions.</div>`),
 'menu-view':()=>actions['workspace-menu'](),'menu-tools':()=>palette(),'menu-window':()=>actions['workspace-menu'](),'menu-help':()=>actions.keyboard()
};
// Global delegated events allow all sixty documents to share one stable command system.
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(Number(g.dataset.go));return}
 const b=e.target.closest('[data-action]');if(b){if(!b.disabled)actions[b.dataset.action]?.();return}
 const a=e.target.closest('[data-asset]');if(a){st.selectedAsset=a.dataset.asset;renderDrawer();if(SC[st.id-1].kind==='catalog')renderCenter();assetDetail(a.dataset.asset);return}
 const d=e.target.closest('[data-drawer]');if(d){st.drawer=d.dataset.drawer;renderDrawer();return}
 const t=e.target.closest('[data-inspector]');if(t){st.inspector=t.dataset.inspector;render();return}
 const c=e.target.closest('[data-catalog-filter]');if(c){st.catalogFilter=c.dataset.catalogFilter;renderCenter();return}
 const th=e.target.closest('[data-theme-choice]');if(th){setTheme(th.dataset.themeChoice);return}
 const k=e.target.closest('[data-schema]');if(k){st.schema=k.dataset.schema;renderCenter();return}
 const p=e.target.closest('[data-point]');if(p){selectPoint(p.dataset.point)}
});
document.addEventListener('input',e=>{
 if(e.target.id==='screen-search'){st.filter=e.target.value;const left=$('.left-panel');const navParent=document.createElement('div');navParent.innerHTML=nav(SC[st.id-1]);$('#screen-nav').innerHTML=$('#screen-nav',navParent).innerHTML;return}
 if(e.target.id==='palette-search'){paletteResults(e.target.value);return}
 if(e.target.dataset.field&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT'){st.drafts[st.id+':'+e.target.dataset.field]=e.target.value;$('#draft-status').textContent='Draft changed';return}
 if(e.target.dataset.transform){const val=Number(e.target.value);if(Number.isFinite(val)){st.transform[e.target.dataset.transform]=val;st.pointTransforms[st.point]={...st.transform};updateGizmoTransform();}}
});
document.addEventListener('change',e=>{
 if(e.target.dataset.config){const level=e.target.dataset.config,slot=e.target.dataset.slot;st.config[level]??={};st.config[level][slot]=e.target.value||null;st.slot=slot;persist();log(`Resolver fixture changed: ${level} / ${slot} = ${e.target.value||'inherit'}`,'Catalog');renderCenter();return}
 if(e.target.id==='resolver-slot'){st.slot=e.target.value;st.drafts[st.id+':Selected slot']=e.target.value;render();return}
 if(e.target.dataset.field){const name=e.target.dataset.field,value=e.target.type==='checkbox'?e.target.checked:e.target.value;st.drafts[st.id+':'+name]=value;if($('#draft-status'))$('#draft-status').textContent='Draft changed';
 if(name==='Selected slot'){st.slot=value;renderCenter()}
 if(name==='Theme'){setTheme(value.toLowerCase())}
 if(name==='Reduced motion'){st.reduced=!!value;persist();document.body.classList.toggle('reduced-motion',st.reduced)}
 if(name==='Guide panel'){st.guide=!!value;render()}
 if(name==='Operation'){st.tool=value.toLowerCase();render()}
 if(name==='Selected sub-point'){const ix=String(value).match(/\[(\d+)\]/);selectPoint(ix?'P'+(Number(ix[1])+1):value)}
 }
});
let drag=null;
function selectPoint(name){st.point=name;st.transform={...(st.pointTransforms[name]||{x:0,y:0,z:0})};['x','y','z'].forEach(a=>{const el=$('#transform-'+a);if(el)el.value=st.transform[a].toFixed(2)});$$('.map-point').forEach(g=>{const c=$('circle',g);c.setAttribute('fill',g.dataset.point===name?'#50dcff':'#23383f')});updateGizmoTransform();toast('Selected '+name+' · independent demo transform')}
function attachGizmos(){const g=$('.gizmo');if(!g)return;g.dataset.base=g.getAttribute('transform');updateGizmoTransform();g.addEventListener('pointerdown',e=>{if(st.tool==='pointer')return;e.preventDefault();drag={g,id:e.pointerId,x:e.clientX,y:e.clientY,before:{...st.transform},base:g.dataset.base,point:st.point};g.setPointerCapture(e.pointerId)});g.addEventListener('pointermove',e=>{if(!drag||drag.g!==g)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(st.tool==='rotate')st.transform.z=drag.before.z+dx*.5;else if(st.tool==='scale'){st.transform.x=Math.max(.1,(drag.before.x||1)+dx*.01);st.transform.y=st.transform.x;st.transform.z=st.transform.x}else {st.transform.x=drag.before.x+dx*.03;st.transform.y=drag.before.y+dy*.03}updateGizmoTransform();['x','y','z'].forEach(a=>{const t=$('#transform-'+a);if(t)t.value=st.transform[a].toFixed(2)});});g.addEventListener('pointerup',()=>{if(!drag)return;st.pointTransforms[drag.point]={...st.transform};log(`Changed independent ${drag.point} ${st.tool} transform in schematic only.`);drag=null});g.addEventListener('pointercancel',()=>cancelDrag())}
function updateGizmoTransform(){const g=$('.gizmo');if(!g)return;const base=g.dataset.base||g.getAttribute('transform');g.dataset.base=base;const tr=st.tool==='rotate'?`rotate(${st.transform.z})`:st.tool==='scale'?`scale(${Math.max(.2,Math.min(2,st.transform.x||1))})`:`translate(${st.transform.x*15},${st.transform.y*15})`;g.setAttribute('transform',base+' '+tr)}
function cancelDrag(){if(!drag)return;st.transform={...drag.before};drag=null;updateGizmoTransform();['x','y','z'].forEach(a=>{const t=$('#transform-'+a);if(t)t.value=st.transform[a].toFixed(2)});toast('Canceled the schematic drag; restored its starting transform.')}
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();return}
 if(e.key==='Escape'){if(drag)cancelDrag();else closeModal();return}
 const modalEl=$('.modal');if(modalEl){if(e.key==='Tab'){const f=$$('button:not(:disabled),input,select,textarea,a[href],[tabindex="0"]',modalEl);const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if(e.key==='Enter'&&e.target.id==='palette-search'){$('.palette-result')?.click()}return}
 if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();go(st.id+1);return}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();go(st.id-1);return}
 if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
 const key=e.key.toLowerCase();if({q:1,w:1,e:1,r:1}[key]&&!e.ctrlKey&&!e.metaKey&&!e.altKey){st.tool={q:'pointer',w:'move',e:'rotate',r:'scale'}[key];render()}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-point]')){e.preventDefault();selectPoint(e.target.dataset.point)}
});
window.addEventListener('hashchange',()=>{clearInterval(st.buildTimer);st.buildTimer=0;st.playing=false;st.filter='';st.catalogFilter='All';st.inspector='details';const s=SC[routeId()-1];const f=s.fields.find(x=>x.label==='Selected slot');if(f)st.slot=String(pageVal(s,f));render()});
window.addEventListener('resize',()=>{if($('#resolution'))$('#resolution').textContent=`${innerWidth} × ${innerHeight}`});
// Exposed pure resolver and state view are used by bundled automated smoke tests.
window.NexusPrototype={resolve,screenCount:SC.length,go,getState:()=>({id:st.id,theme:st.theme,reviews:structuredClone(st.reviews),pointTransforms:structuredClone(st.pointTransforms),config:structuredClone(st.config)}),getScreen:()=>SC[st.id-1]};
const initial=SC[routeId()-1],slotF=initial.fields.find(f=>f.label==='Selected slot');if(slotF)st.slot=String(pageVal(initial,slotF));render();
})();
</script></body></html>
